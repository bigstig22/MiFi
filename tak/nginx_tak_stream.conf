# Nginx Stream Configuration for TAK Server TCP Proxy
# This file should be placed in /etc/nginx/stream.d/ or included in nginx.conf
# 
# TAK Server uses raw TCP connections for CoT (Cursor on Target) messages
# HTTP/HTTPS proxies cannot handle raw TCP - use nginx stream module instead
#
# Installation:
# 1. Ensure nginx has stream module: nginx -V | grep stream
# 2. Add this to /etc/nginx/nginx.conf:
#    stream {
#        include /etc/nginx/stream.d/*.conf;
#    }
# 3. Place this file in /etc/nginx/stream.d/tak.conf
# 4. Reload nginx: sudo nginx -t && sudo systemctl reload nginx

stream {
    # TAK Server TCP Stream Proxy (CoT messages)
    # IMPORTANT: If TAK Server is configured for TLS, nginx must pass through TLS
    # This configuration passes through TLS (does not terminate it)
    server {
        listen 8087;
        # If TAK Server expects TLS, use proxy_pass with TLS passthrough
        # This forwards the TLS connection directly to TAK Server
        proxy_pass 192.168.50.90:8087;
        proxy_timeout 10s;
        proxy_responses 1;
        # Enable SSL passthrough (nginx doesn't decrypt, just forwards)
        # Note: nginx stream module doesn't support SSL passthrough directly
        # If TAK Server requires TLS, you may need to:
        # 1. Connect directly to TAK Server IP (bypass nginx)
        # 2. Or configure nginx to terminate TLS and re-encrypt (complex)
        error_log /var/log/nginx/tak_stream_error.log;
        access_log /var/log/nginx/tak_stream_access.log;
    }
    
    # Optional: TAK Server UDP Stream Proxy (if using UDP)
    # Uncomment if you need UDP support
    # server {
    #     listen 8088 udp;
    #     proxy_pass 192.168.50.90:8088;
    #     proxy_timeout 1s;
    #     proxy_responses 1;
    #     error_log /var/log/nginx/tak_stream_udp_error.log;
    #     access_log /var/log/nginx/tak_stream_udp_access.log;
    # }
}

